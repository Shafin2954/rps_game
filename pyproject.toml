[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rps-game-cli"
dynamic = ["version"]
description = "Rock Paper Scissors for the terminal: a roguelike Gauntlet, a mind-reading AI and online duels"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sohanur Rahman Sohan" }]
dependencies = ["pyfiglet>=1.0", "rich>=13"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Games/Entertainment",
]

[project.optional-dependencies]
# Dual Player needs Magic Wormhole, which needs PyNaCl (hard to build on some phones).
online = ["magic-wormhole>=0.24,<1"]
dev = ["pytest>=7", "ruff", "hypothesis", "magic-wormhole>=0.24,<1",
       "magic-wormhole-mailbox-server"]

[project.scripts]
rps = "rps_game.cli:main"

[tool.setuptools.packages.find]
include = ["rps_game*"]

[tool.setuptools.dynamic]
version = { attr = "rps_game.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
